    // ── Astronomy (suncalc-style port) ────────────────────────────────
    const toDays = (d) => d.getTime() / 86400000 - 0.5 + 2440588 - 2451545;
    function sunCoords(d) {
        const M = RAD * (357.5291 + 0.98560028 * d);
        const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2*M) + 0.0003 * Math.sin(3*M));
        const L = M + C + RAD * 102.9372 + PI;
        return { dec: Math.asin(Math.sin(OBLIQUITY)*Math.sin(L)), ra: Math.atan2(Math.sin(L)*Math.cos(OBLIQUITY), Math.cos(L)) };
    }
    function moonCoords(d) {
        const L = RAD * (218.316 + 13.176396 * d);
        const M = RAD * (134.963 + 13.064993 * d);
        const F = RAD * (93.272 + 13.229350 * d);
        const lng = L + RAD * 6.289 * Math.sin(M);
        const lat = RAD * 5.128 * Math.sin(F);
        return {
            ra:  Math.atan2(Math.sin(lng)*Math.cos(OBLIQUITY) - Math.tan(lat)*Math.sin(OBLIQUITY), Math.cos(lng)),
            dec: Math.asin(Math.sin(lat)*Math.cos(OBLIQUITY) + Math.cos(lat)*Math.sin(OBLIQUITY)*Math.sin(lng)),
            dist: 385001 - 20905 * Math.cos(M),
        };
    }
    function moonIllumination(date) {
        const d = toDays(date), s = sunCoords(d), m = moonCoords(d), sd = 149598000;
        const phi = Math.acos(Math.sin(s.dec)*Math.sin(m.dec) + Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
        const inc = Math.atan2(sd*Math.sin(phi), m.dist - sd*Math.cos(phi));
        return (1 + Math.cos(inc)) / 2;
    }
    function moonPhaseLabel(illum, date) {
        const d = toDays(date), s = sunCoords(d), m = moonCoords(d);
        let diff = (m.ra - s.ra) * (180/PI);
        diff = ((diff % 360) + 360) % 360;
        const wax = diff < 180;
        if (illum < 0.03) return 'New moon';
        if (illum > 0.97) return 'Full moon';
        if (illum < 0.47) return wax ? 'Waxing crescent' : 'Waning crescent';
        if (illum < 0.53) return wax ? 'First quarter' : 'Last quarter';
        return wax ? 'Waxing gibbous' : 'Waning gibbous';
    }
    function siderealTime(d, lw) { return RAD * (280.16 + 360.9856235 * d) - lw; }
    function altFromHA(H, phi, dec) { return Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H)); }
    function sunAltitude(date, lat, lon) {
        const d = toDays(date), c = sunCoords(d);
        const H = siderealTime(d, RAD * -lon) - c.ra;
        return altFromHA(H, RAD * lat, c.dec);
    }
    function moonAltitude(date, lat, lon) {
        const d = toDays(date), c = moonCoords(d);
        const H = siderealTime(d, RAD * -lon) - c.ra;
        return altFromHA(H, RAD * lat, c.dec);
    }

    // ── NWS gridpoint helpers ─────────────────────────────────────────
    function parseDuration(iso) {
        const m = iso.match(/P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/);
        if (!m) return 0;
        return ((+(m[1]||0)*24 + +(m[2]||0))*60 + +(m[3]||0)) * 60000;
    }
    function valueAt(values, target) {
        for (const e of values) {
            const [s, dur] = e.validTime.split('/');
            const start = new Date(s).getTime();
            if (target >= start && target < start + parseDuration(dur)) return e.value;
        }
        return null;
    }
    const nwsGridCache = {};
    async function fetchGrid(grid) {
        if (nwsGridCache[grid]) return nwsGridCache[grid];
        const r = await fetch(`https://api.weather.gov/gridpoints/${grid}`);
        if (!r.ok) throw new Error(`NWS ${grid}: ${r.status}`);
        const d = await r.json();
        const out = {
            skyCover: (d.properties?.skyCover?.values) || [],
            weather:  (d.properties?.weather?.values)  || [],
        };
        nwsGridCache[grid] = out;
        return out;
    }
    let _tafsPromise = null;
    async function fetchTAFs(stations) {
        if (_tafsPromise) return _tafsPromise;
        _tafsPromise = (async () => {
            try {
                const ids = [...new Set(stations)].join(',');
                const r = await fetch(`${TAF_WORKER}/?ids=${ids}`);
                if (!r.ok) return {};
                const data = await r.json();
                const map = {};
                for (const rec of data) if (rec.icaoId && !map[rec.icaoId]) map[rec.icaoId] = rec;
                return map;
            } catch (e) { return {}; }
        })();
        return _tafsPromise;
    }
    function tafPeriodAt(rec, sec) {
        if (!rec || !Array.isArray(rec.fcsts)) return null;
        return rec.fcsts.find(p => p.timeFrom <= sec && sec < p.timeTo) || null;
    }
    function classifyTAF(period) {
        if (!period || !Array.isArray(period.clouds)) return { score: 0, verdict: null };
        const clouds = period.clouds.filter(c => c && c.base !== null);
        const veryLow = clouds.filter(c => c.base < 3000);
        const low = clouds.filter(c => c.base < 5000);
        const high = clouds.filter(c => c.base >= 20000);
        const vlH = veryLow.find(c => c.cover === 'BKN' || c.cover === 'OVC');
        const lH = low.find(c => c.cover === 'BKN' || c.cover === 'OVC');
        const lM = low.find(c => c.cover === 'SCT');
        const lL = low.find(c => c.cover === 'FEW');
        const hH = high.find(c => c.cover === 'BKN' || c.cover === 'OVC');
        let score = 0, verdict = null;
        if (vlH) { score += 60; verdict = 'Marine layer'; }
        else if (lH) { score += 40; verdict = `Low clouds (${lH.base}ft)`; }
        else if (lM) { score += 20; verdict = `Patchy low clouds (${lM.base}ft)`; }
        else if (lL) { score += 10; }
        if (hH && !vlH && !lH) { score -= 15; if (!verdict) verdict = 'Cirrus — best color'; }
        return { score, verdict };
    }
    function verdictForCloud(c) {
        if (c < 20) return 'Clear & golden';
        if (c < 50) return 'Great for color';
        if (c < 75) return 'Partly cloudy';
        if (c < 90) return 'Hazy';
        return 'Socked in';
    }
    function gradeFor(label) {
        if (label === 'Cirrus — best color') return 'A+';
        if (label === 'Great for color')     return 'A';
        if (label === 'Partly cloudy')       return 'B';
        if (label === 'Clear & golden')      return 'C';
        if (label === 'Hazy')                return 'D';
        if (label.startsWith('Low clouds'))  return 'D';
        if (label.startsWith('Patchy low'))  return 'C-';
        if (label === 'Marine layer')        return 'F';
        if (label === 'Socked in')           return 'D';
        return 'D';
    }
    const GRADE_RANK = { 'A+': 0, 'A': 1, 'B': 2, 'C': 3, 'C-': 4, 'D': 5, 'F': 6 };
    function blocking(w) { return Array.isArray(w) ? (w.find(x => x && x.weather) || null) : null; }

    // ── Stargazing scoring (mirrors stargaze) ─────────────────────────
    function bortleBonus(b) { return Math.max(0.3, 1 - (b - 2) * 0.15); }
    function scoreStargazeNight(skyValues, lat, lon, bortle, nightStart) {
        const STEP_MIN = 15;
        const HOURS = STEP_MIN / 60;
        const wsMs = nightStart + (WINDOW_START_HOUR - 12) * 3600000;
        const weMs = nightStart + (WINDOW_END_HOUR - 12) * 3600000;
        const samples = Math.round((weMs - wsMs) / (STEP_MIN * 60000));
        let darkH = 0, clearDarkH = 0, totalCloud = 0, cloudSamples = 0;
        let moonUpDuringDarkH = 0, moonIllumSum = 0, moonIllumWeight = 0;
        let darkStart = null, darkEnd = null;
        for (let i = 0; i < samples; i++) {
            const t = wsMs + i * STEP_MIN * 60000;
            const date = new Date(t);
            if (sunAltitude(date, lat, lon) * (180/PI) >= -18) continue;
            const cloud = valueAt(skyValues, t);
            if (cloud == null) continue;
            const moonAlt = moonAltitude(date, lat, lon) * (180/PI);
            if (moonAlt > 0) {
                moonUpDuringDarkH += HOURS;
                moonIllumSum += moonIllumination(date);
                moonIllumWeight++;
                continue;
            }
            darkH += HOURS;
            if (darkStart === null) darkStart = t;
            darkEnd = t + STEP_MIN * 60000;
            totalCloud += cloud;
            cloudSamples++;
            clearDarkH += (1 - cloud/100) * HOURS;
        }
        return {
            score: clearDarkH * bortleBonus(bortle),
            darkH, clearDarkH,
            avgCloud: cloudSamples ? totalCloud / cloudSamples : null,
            moonUpDuringDarkH,
            avgMoonIllum: moonIllumWeight ? moonIllumSum / moonIllumWeight : 0,
            darkStart, darkEnd,
        };
    }
    function maxStargazeScore(lat, lon, nightStart) {
        const STEP_MIN = 15, HOURS = STEP_MIN / 60;
        const wsMs = nightStart + (WINDOW_START_HOUR - 12) * 3600000;
        const weMs = nightStart + (WINDOW_END_HOUR - 12) * 3600000;
        const samples = Math.round((weMs - wsMs) / (STEP_MIN * 60000));
        let darkH = 0;
        for (let i = 0; i < samples; i++) {
            const t = wsMs + i * STEP_MIN * 60000;
            if (sunAltitude(new Date(t), lat, lon) * (180/PI) < -18) darkH += HOURS;
        }
        return darkH;
    }
    function galacticCoreVisible(lat, lon, darkStart, darkEnd) {
        if (!darkStart || !darkEnd) return false;
        const STEP = 30 * 60000, coreRA = RAD * 266.4, coreDec = RAD * -29;
        for (let t = darkStart; t <= darkEnd; t += STEP) {
            const d = toDays(new Date(t));
            const H = siderealTime(d, RAD * -lon) - coreRA;
            const alt = altFromHA(H, RAD * lat, coreDec) * (180/PI);
            if (alt > 20) return true;
        }
        return false;
    }

    // ── Open-Meteo (one fetch per coord) ──────────────────────────────
    const meteoCache = {};
    async function fetchMeteo(lat, lon) {
        const key = `${lat},${lon}`;
        if (meteoCache[key]) return meteoCache[key];
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
            + `&hourly=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m,wind_direction_10m,uv_index`
            + `&daily=temperature_2m_min,temperature_2m_max,weather_code,wind_speed_10m_max`
            + `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=8`;
        const r = await fetch(url);
        if (!r.ok) throw new Error(`Open-Meteo ${lat},${lon}: ${r.status}`);
        const data = await r.json();
        meteoCache[key] = data;
        return data;
    }
    function indexAt(hourly, date, hour) {
        const y = date.getFullYear();
        const mo = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const h = String(hour).padStart(2, '0');
        return hourly.time.indexOf(`${y}-${mo}-${d}T${h}:00`);
    }
    function dailyIndex(daily, date) {
        const y = date.getFullYear();
        const mo = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return daily.time.indexOf(`${y}-${mo}-${d}`);
    }
    function weatherEmoji(code) {
        if (code === 0) return '☀️';
        if (code === 1) return '🌤️';
        if (code === 2) return '⛅';
        if (code === 3) return '☁️';
        if (code <= 48) return '🌫️';
        if (code <= 55) return '🌦️';
        if (code <= 65) return '🌧️';
        if (code <= 77) return '🌨️';
        if (code === 80) return '🌦️';
        if (code <= 82) return '🌧️';
        if (code <= 86) return '🌨️';
        return '⛈️';
    }
    // Match sd_dog_beaches exactly so the dog-beach table emojis align with that site.
    function beachWeatherEmoji(code) {
        const m = { 0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️', 45:'🌫️', 48:'🌫️',
                    51:'🌦️', 53:'🌧️', 61:'🌧️', 63:'🌧️', 65:'🌧️',
                    80:'🌦️', 95:'⛈️' };
        return m[code] || '🌈';
    }
    function uvLabel(uv) {
        if (uv == null) return null;
        if (uv <= 2) return { label: 'Low', color: '#16a34a' };
        if (uv <= 5) return { label: 'Moderate', color: '#ca8a04' };
        if (uv <= 7) return { label: 'High', color: '#ea580c' };
        if (uv <= 10) return { label: 'Very High', color: '#dc2626' };
        return { label: 'Extreme', color: '#9333ea' };
    }
    function windDir(deg) {
        const dirs = ['N','NE','E','SE','S','SW','W','NW'];
        return dirs[Math.round(deg / 45) % 8];
    }

    // ── Market hour helpers ───────────────────────────────────────────
    function getOpenHours(market, date) {
        if (Array.isArray(market.openHours)) {
            const m = date.getMonth() + 1;
            return market.openHours.find(o => o.months.includes(m)) || null;
        }
        return market.openHours;
    }
    function isMarketActive(market, date) {
        const m = date.getMonth() + 1;
        if (market.closedMonths && market.closedMonths.includes(m)) return false;
        return !!getOpenHours(market, date);
    }

    // ── NDBC water temp (mirrors sd_dog_beaches) ──────────────────────
    async function fetchWaterTemp(buoyId) {
        try {
            const r = await fetch(`https://corsproxy.io/?https://www.ndbc.noaa.gov/data/realtime2/${buoyId}.txt`);
            if (!r.ok) return null;
            const text = await r.text();
            const lines = text.trim().split('\n');
            if (lines.length < 3) return null;
            const header = lines[0].trim().split(/\s+/);
            const data = lines[2].trim().split(/\s+/);
            const idx = header.indexOf('WTMP');
            if (idx === -1) return null;
            const tempC = parseFloat(data[idx]);
            if (isNaN(tempC) || tempC === 99 || tempC === 999) return null;
            return Math.round(tempC * 9/5 + 32);
        } catch (e) { return null; }
    }

    // ── Sunset time fetch ─────────────────────────────────────────────
    function pacificISODate(date) {
        // 'en-CA' formats as YYYY-MM-DD; 'America/Los_Angeles' picks the Pacific calendar day
        return date.toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    }
    const _solarCache = {};
    async function fetchSolar(date) {
        const iso = pacificISODate(date);
        if (_solarCache[iso]) return _solarCache[iso];
        const r = await fetch(`https://api.sunrise-sunset.org/json?lat=${SD_LAT}&lng=${SD_LON}&date=${iso}&formatted=0`);
        const d = await r.json();
        const out = { sunrise: new Date(d.results.sunrise), sunset: new Date(d.results.sunset) };
        _solarCache[iso] = out;
        return out;
    }
    async function fetchSunset(date) { return (await fetchSolar(date)).sunset; }

    // ── Helpers ───────────────────────────────────────────────────────
    function fmtTime(d) {
        return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }
    function fmtDay(date) {
        return date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }
    function nextDayOfWeek(target) {
        const today = new Date();
        const days = (target - today.getDay() + 7) % 7 || 7;
        const d = new Date(today);
        d.setDate(today.getDate() + days);
        d.setHours(12, 0, 0, 0);
        return d;
    }

    // ── Header live updates ───────────────────────────────────────────
    function updateClock() {
        const now = new Date();
        const t = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const el = document.getElementById('timeLine');
        if (el) el.textContent = t;
    }
    function updateSunIcon() {
        const disc = document.getElementById('sunDisc');
        if (!disc) return;
        const altDeg = sunAltitude(new Date(), SD_LAT, SD_LON) * 180 / PI;
        const cap = Math.max(-15, Math.min(75, altDeg));
        const cy = cap >= 0 ? 55 - cap * 0.62 : 55 - cap * 0.7;
        disc.setAttribute('cy', cy.toFixed(1));
    }
    function updateMoonIcon() {
        const svg = document.getElementById('moonIcon');
        if (!svg) return;
        const now = new Date();
        const illum = moonIllumination(now);
        const d = toDays(now), s = sunCoords(d), m = moonCoords(d);
        let raDiff = ((m.ra - s.ra) * 180 / PI) % 360;
        if (raDiff < 0) raDiff += 360;
        const waxing = raDiff < 180;
        const r = 28;
        let inner = `<circle cx="0" cy="0" r="${r}" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>`;
        if (illum > 0.99) {
            inner += `<circle cx="0" cy="0" r="${r}" fill="#f3ecd6"/>`;
        } else if (illum > 0.01) {
            const xR = Math.max(r * Math.abs(1 - 2 * illum), 0.01);
            const outerSweep = waxing ? 1 : 0;
            const innerSweep = illum < 0.5 ? 0 : 1;
            const path = `M 0 ${-r} A ${r} ${r} 0 0 ${outerSweep} 0 ${r} A ${xR} ${r} 0 0 ${innerSweep} 0 ${-r} Z`;
            inner += `<path d="${path}" fill="#f3ecd6"/>`;
        }
        svg.innerHTML = inner;
        const phase = moonPhaseLabel(illum, now);
        svg.setAttribute('title', `${phase} · ${Math.round(illum * 100)}%`);
    }

    // ── Main ──────────────────────────────────────────────────────────
    async function run() {
        if (!LOCATIONS) { renderSetup(); return; }
        const now = new Date();
        const dow = now.getDay();
        const isWeekend = dow === 0 || dow === 6;
        const showWeekendPrep = dow !== 0;

        document.getElementById('dateLine').textContent = fmtDay(now);
        updateClock();
        // Tick every minute so the time + sun position stay current.
        setInterval(() => { updateClock(); updateSunIcon(); }, 60000);

        const sections = [];

        // ── Weather slots ─────────────────────────────────────────────
        sections.push(await renderWeather(now, isWeekend));

        // ── Trash / recycling pickup ─────────────────────────────────
        sections.push(await renderTrash());

        // ── Commute (weekdays only) ──────────────────────────────────
        if (!isWeekend) {
            sections.push(await renderCommute(now));
        }

        // ── Sports (configured teams) ────────────────────────────────
        sections.push(await renderSports(now));

        // ── TV (favorite shows) ──────────────────────────────────────
        sections.push(await renderTV(now));

        // ── Sunrise + Sunset ──────────────────────────────────────────
        sections.push(await renderSunrise(now));
        sections.push(await renderSunset(now));

        // ── Stargazing tonight ────────────────────────────────────────
        sections.push(await renderStargaze(now));

        // ── Farmers markets today (skip on weekends — handled by weekend prep) ─
        if (!isWeekend) {
            sections.push(await renderFarmers(now));
        }

        // ── Weekend prep (if not Sunday) ──────────────────────────────
        if (showWeekendPrep) {
            sections.push(await renderWeekendPrep());
        }

        document.getElementById('content').innerHTML = sections.join('');
        // SVGs only exist after innerHTML is set; populate them now.
        updateSunIcon();
        updateMoonIcon();
    }

    async function renderWeather(now, isWeekend) {
        const HOME = LOCATIONS.home, WORK = LOCATIONS.work;
        const slots = isWeekend
            ? [
                { hour: 8,  loc: HOME, label: '8am' },
                { hour: 12, loc: HOME, label: 'Noon', uv: true },
                { hour: 17, loc: HOME, label: '5pm' },
              ]
            : [
                { hour: 8,  loc: HOME, label: '8am' },
                { hour: 12, loc: WORK, label: 'Noon', uv: true },
                { hour: 17, loc: HOME, label: '5pm' },
              ];

        try {
            // Fetch all unique coords in parallel
            const uniqLocs = [...new Map(slots.map(s => [`${s.loc.lat},${s.loc.lon}`, s.loc])).values()];
            if (!uniqLocs.find(l => l.lat === HOME.lat && l.lon === HOME.lon)) uniqLocs.push(HOME);
            await Promise.all(uniqLocs.map(l => fetchMeteo(l.lat, l.lon)));

            const cards = slots.map(s => {
                const meteo = meteoCache[`${s.loc.lat},${s.loc.lon}`];
                const idx = indexAt(meteo.hourly, now, s.hour);
                if (idx === -1) {
                    return `<div class="rounded-xl p-3 bg-slate-700/40">
                        <div class="label">${s.label} · ${s.loc.label}</div>
                        <div class="text-slate-400 text-sm mt-1">No data</div>
                    </div>`;
                }
                const h = meteo.hourly;
                const temp = Math.round(h.temperature_2m[idx]);
                const feel = Math.round(h.apparent_temperature[idx]);
                const code = h.weather_code[idx];
                const hum = Math.round(h.relative_humidity_2m[idx]);
                const wSpeed = Math.round(h.wind_speed_10m[idx]);
                const wDir = windDir(h.wind_direction_10m[idx]);
                const uv = s.uv ? Math.round(h.uv_index[idx]) : null;
                const uvL = s.uv ? uvLabel(uv) : null;
                return `<div class="rounded-xl p-3 bg-slate-700/40">
                    <div class="flex items-baseline justify-between">
                        <div class="label">${s.label} · ${s.loc.label}</div>
                        <div class="text-2xl">${weatherEmoji(code)}</div>
                    </div>
                    <div class="flex items-baseline justify-between flex-wrap gap-x-3 gap-y-1 mt-0.5">

    async function evaluateSunset(date) {
        const sunset = await fetchSunset(date);
        const sunsetMs = sunset.getTime();
        const uniqGrids = [...new Set(SPOTS.map(s => s.grid))];
        const gridResults = await Promise.all(uniqGrids.map(g => fetchGrid(g).then(d => [g, d]).catch(() => [g, { skyCover: [], weather: [] }])));
        const gridMap = Object.fromEntries(gridResults);
        const tafMap = await fetchTAFs(SPOTS.map(s => s.taf));
        const sec = Math.floor(sunsetMs / 1000);
        const evaluated = SPOTS.map(s => {
            const g = gridMap[s.grid];
            const cloud = valueAt(g.skyCover, sunsetMs);
            if (cloud == null) return null;
            const blocker = blocking(valueAt(g.weather, sunsetMs));
            const taf = classifyTAF(tafPeriodAt(tafMap[s.taf], sec));
            let label = taf.verdict
                || (blocker ? blocker.weather.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()) : verdictForCloud(cloud));
            const grade = gradeFor(label);
            let score = Math.abs(cloud - 40) + taf.score + (blocker && !taf.verdict ? 35 : 0);
            return { ...s, cloud, label, grade, score };
        }).filter(Boolean);
        evaluated.sort((a, b) => (GRADE_RANK[a.grade] - GRADE_RANK[b.grade]) || (a.score - b.score));
        return { sunset, top: evaluated[0] };
    }

    function daysUntilDayOfWeek(targetDow) {
        const today = new Date();
        const todayDow = today.getDay();
        let diff = targetDow - todayDow;
        if (diff < 0) diff += 7;
        return diff;
    }
    function daysUntilRecycling(nextDateStr) {
        if (!nextDateStr) return null;
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const target = new Date(nextDateStr + 'T00:00:00');
        // Cycle biweekly until we land on or after today
        while (target.getTime() < today.getTime()) target.setDate(target.getDate() + 14);
        return Math.round((target - today) / 86400000);
    }
    function whenLabel(days) {
        if (days === 0) return 'today';
        if (days === 1) return 'tomorrow';
        // Calendar-week boundary (US convention: week is Sunday–Saturday).
        const todayDow = new Date().getDay(); // 0=Sun ... 6=Sat
        const daysUntilSaturday = 6 - todayDow;
        if (days <= daysUntilSaturday) return 'this week';
        if (days <= daysUntilSaturday + 7) return 'next week';
        return null;
    }

    async function renderTrash() {

        const tDays = sched.trashDay != null ? daysUntilDayOfWeek(sched.trashDay) : null;

        // Show the card only when at least one of them is today or tomorrow.
        // When the card shows, include the other one with broader wording
        // (this week / next week) if applicable.
        const eitherClose = (tDays != null && tDays <= 1) || (rDays != null && rDays <= 1);
        if (!eitherClose) return '';
        const tLabel = tDays != null ? whenLabel(tDays) : null;
        const rLabel = rDays != null ? whenLabel(rDays) : null;
        const parts = [];
        if (tLabel) parts.push(`<div><span class="text-lg mr-1">🗑️</span><span class="font-semibold">Trash</span> <span class="text-slate-300">${tLabel}</span></div>`);
        if (rLabel) parts.push(`<div><span class="text-lg mr-1">♻️</span><span class="font-semibold">Recycling</span> <span class="text-slate-300">${rLabel}</span></div>`);
        if (!parts.length) return '';
        return `<section class="card rounded-xl p-3">

    }

        const key = `${sport}/${league}`;

        try {
            const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sport}/${league}/teams`);

            const data = await r.json();
            _teamsCache[key] = (data?.sports?.[0]?.leagues?.[0]?.teams || []).map(t => t.team);

    async function searchSportsTeam(name) {
        const lower = name.toLowerCase();
        for (const lg of ESPN_LEAGUES) {
            const teams = await fetchLeagueTeams(lg.sport, lg.league);
            for (const t of teams) {
                const candidates = [t.displayName, t.name, t.shortDisplayName, t.location, t.abbreviation]
                    .filter(Boolean).map(s => s.toLowerCase());
                if (candidates.some(c => c === lower || c.includes(lower) || lower.includes(c))) {
                    return {
                        name: t.displayName,
                        shortName: t.shortDisplayName || t.name || t.displayName,
                        sport: lg.sport,
                        league: lg.league,
                        id: String(t.id),
                    };
                }
            }
        }
        throw new Error(`Team not found: ${name}`);

    async function renderSports(now) {
        const teams = LOCATIONS.teams || [];
        if (!teams.length) return '';
        const dateStr = pacificISODate(now).replace(/-/g, '');
        // Group by league to share scoreboard fetches
        const byLeague = {};
        for (const team of teams) {
            const key = `${team.sport}/${team.league}`;
            if (!byLeague[key]) byLeague[key] = { sport: team.sport, league: team.league, teams: [] };
            byLeague[key].teams.push(team);
        }
        const lines = [];
        await Promise.all(Object.values(byLeague).map(async grp => {
            try {
                const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${grp.sport}/${grp.league}/scoreboard?dates=${dateStr}`);
                if (!r.ok) return;
                const data = await r.json();
                const events = data.events || [];
                for (const team of grp.teams) {
                    for (const ev of events) {
                        const comp = ev.competitions?.[0];
                        if (!comp) continue;
                        const competitors = comp.competitors || [];
                        const me = competitors.find(c => String(c.team?.id) === team.id);
                        if (!me) continue;
                        const opp = competitors.find(c => c !== me);
                        if (!opp) continue;
                        const isHome = me.homeAway === 'home';
                        const start = new Date(ev.date);
                        const stateName = comp.status?.type?.state || 'pre';
                        const myScore = parseInt(me.score) || 0;
                        const oppScore = parseInt(opp.score) || 0;
                        const oppLabel = opp.team.shortDisplayName || opp.team.abbreviation || 'Opp';
                        let summary;
                        if (stateName === 'pre') {
                            summary = `${isHome ? 'vs' : '@'} ${oppLabel} · <span class="font-semibold">${fmtTime(start)}</span>`;
                        } else if (stateName === 'in') {
                            const detail = comp.status?.type?.shortDetail || 'live';
                            summary = `${isHome ? 'vs' : '@'} ${oppLabel} · <span class="text-amber-300">${detail}</span> · <span class="font-semibold">${myScore}–${oppScore}</span>`;
                        } else {
                            const result = myScore > oppScore ? 'beat' : myScore < oppScore ? 'lost to' : 'tied';
                            summary = `${result} ${oppLabel} <span class="font-semibold">${myScore}–${oppScore}</span>`;
                        }
                        lines.push(`<li><span class="font-semibold">${team.shortName}</span> <span class="text-slate-300">${summary}</span></li>`);

    function fmt12FromHHMM(timeStr) {
        if (!timeStr) return '';
        const [h, m] = timeStr.split(':').map(Number);
        const hour12 = ((h + 11) % 12) + 1;
        const ampm = h < 12 ? 'AM' : 'PM';

    async function renderTV(now) {
        const shows = LOCATIONS.shows || [];
        if (!shows.length) return '';
        const todayStr = pacificISODate(now);
        const horizonStr = pacificISODate(new Date(now.getTime() + 7 * 86400000));

        const lines = [];
        await Promise.all(shows.map(async show => {
            try {
                const [episodes, seasons] = await Promise.all([
                    tvmazeEpisodes(show.id),
                    tvmazeSeasons(show.id),
                ]);
                const seasonOrder = {};
                for (const s of seasons) seasonOrder[s.number] = s.episodeOrder;

                for (const ep of episodes) {
                    if (!ep.airdate) continue;
                    const isPremiere = ep.number === 1;
                    const isFinale = seasonOrder[ep.season] && ep.number === seasonOrder[ep.season];
                    const tag = isPremiere ? ' (premiere)' : isFinale ? ' (finale)' : '';

                    if (show.type === 'broadcast') {
                        if (ep.airdate !== todayStr) continue;
                        const time = ep.airtime ? fmt12FromHHMM(ep.airtime) : '';
                        lines.push({ when: 0, html: `<li><span class="font-semibold">${show.name}</span>${time ? ` <span class="text-slate-400">— ${time}</span>` : ''}${tag ? `<span class="text-amber-300">${tag}</span>` : ''}</li>` });
                    } else {
                        if (ep.airdate < todayStr || ep.airdate > horizonStr) continue;
                        const days = Math.round((new Date(ep.airdate + 'T12:00:00').getTime() - new Date(todayStr + 'T12:00:00').getTime()) / 86400000);
                        const dayLabel = days === 0
                            ? 'today'
                            : new Date(ep.airdate + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
                        lines.push({ when: days, html: `<li><span class="font-semibold">${show.name}</span> <span class="text-slate-400">S${ep.season}E${ep.number}</span> <span class="text-slate-400">— ${dayLabel}</span>${tag ? `<span class="text-amber-300">${tag}</span>` : ''}</li>` });
                    }

            </div>

        </section>`;
    }

        const noonStart = new Date(date); noonStart.setHours(12, 0, 0, 0);
        const ns = noonStart.getTime();

        const uniqGrids = [...new Set(STAR_SITES.map(s => s.grid))];
        const grids = await Promise.all(uniqGrids.map(g => fetchGrid(g).then(d => [g, d.skyCover]).catch(() => [g, []])));
        const skyMap = Object.fromEntries(grids);

        const evaluated = STAR_SITES.map(s => {
            const sky = skyMap[s.grid] || [];
            const r = scoreStargazeNight(sky, s.lat, s.lon, s.bortle, ns);
            const cap = maxStargazeScore(s.lat, s.lon, ns);
            return { ...s, ...r, pct: cap > 0 ? r.score / cap : 0, nightStart: ns };
        });
        evaluated.sort((a, b) => b.score - a.score);
        return evaluated;
    }

        }).join('');

        return `<section class="card rounded-xl p-4">
            <div class="flex items-baseline justify-between mb-1">
                <h2 class="text-lg font-semibold">Farmers markets today</h2>
                <a class="section-link" href="https://samiprehn.github.io/sd_farmers_markets/" target="_blank" rel="noopener">full site ↗</a>
            </div>
            <div>${rows}</div>
        </section>`;
    }

    async function renderWeekendPrep() {
        const today = new Date();
        const isSat = today.getDay() === 6;
        // On Saturday, Sat = today's date; otherwise Sat = upcoming Saturday.
        const sat = isSat ? (() => { const d = new Date(today); d.setHours(12,0,0,0); return d; })() : nextDayOfWeek(6);
        const sun = nextDayOfWeek(0);

        // Dog beaches: Open-Meteo daily highs + noon humidity per beach
        await Promise.all(DOG_BEACHES.map(b => fetchMeteo(b.lat, b.lon).catch(() => null)));

        function beachRow(b, date, dayLabel, extraClass = '') {
            const meteo = meteoCache[`${b.lat},${b.lon}`];
            if (!meteo) return `<tr class="${extraClass}"><td class="px-2 py-1 text-xs text-slate-500" colspan="5">${b.name} ${dayLabel} — no data</td></tr>`;
            const dIdx = dailyIndex(meteo.daily, date);
            const noonIdx = indexAt(meteo.hourly, date, 12);
            if (dIdx < 0) return `<tr class="${extraClass}"><td class="px-2 py-1 text-xs text-slate-500" colspan="5">${b.name} ${dayLabel} —</td></tr>`;
            const high = Math.round(meteo.daily.temperature_2m_max[dIdx]);
            // Find the hour that produced the daily high, then read apparent_temperature at that hour
            const dateStr = pacificISODate(date);
            let peakIdx = -1, peakTemp = -Infinity;
            for (let i = 0; i < meteo.hourly.time.length; i++) {
                if (!meteo.hourly.time[i].startsWith(dateStr)) continue;
                const t = meteo.hourly.temperature_2m[i];
                if (t > peakTemp) { peakTemp = t; peakIdx = i; }
            }
            const feel = peakIdx >= 0 ? Math.round(meteo.hourly.apparent_temperature[peakIdx]) : null;
            // Match sd_dog_beaches: use the noon-hour weather_code, not the daily aggregate
            const code = noonIdx >= 0 ? meteo.hourly.weather_code[noonIdx] : meteo.daily.weather_code[dIdx];
            const wind = noonIdx >= 0 ? Math.round(meteo.hourly.wind_speed_10m[noonIdx]) : Math.round(meteo.daily.wind_speed_10m_max[dIdx]);
            const hum = noonIdx >= 0 ? Math.round(meteo.hourly.relative_humidity_2m[noonIdx]) : null;
            return `<tr class="${extraClass}">
                <td class="px-2 py-1 text-xs text-slate-400">${dayLabel}</td>
                <td class="px-2 py-1 text-sm font-medium">${b.name}</td>
                <td class="px-2 py-1 text-sm whitespace-nowrap"><span>${beachWeatherEmoji(code)}</span> <span class="font-semibold">${high}°</span>${feel != null ? `<span class="text-xs text-slate-400 ml-1">feels ${feel}°</span>` : ''}</td>
                <td class="px-2 py-1 text-sm whitespace-nowrap">${wind} mph</td>
                <td class="px-2 py-1 text-sm whitespace-nowrap">${hum != null ? hum + '%' : '—'}</td>
            </tr>`;
        }
        // Bottom-border on the last Sat row to separate Sat from Sun in the table.
        const satRows = DOG_BEACHES.map((b, i) => beachRow(b, sat, 'Sat', i === DOG_BEACHES.length - 1 ? 'border-b border-white/15' : ''));
        const sunRows = DOG_BEACHES.map(b => beachRow(b, sun, 'Sun'));
        const beachRows = [...satRows, ...sunRows].join('');

        // Markets Sat/Sun
        const satMkts = MARKETS.filter(m => m.day === 6 && isMarketActive(m, sat));
        const sunMkts = MARKETS.filter(m => m.day === 0 && isMarketActive(m, sun));

        // Fetch weather for all unique market ZIPs across the weekend in parallel
        const mktZips = [...new Set([...satMkts, ...sunMkts].map(m => m.zip))];
        await Promise.all(mktZips.map(z => {
            const c = MARKET_ZIP_COORDS[z];
            return c ? fetchMeteo(c[0], c[1]).catch(() => null) : null;
        }));

        const mktItem = (m, date) => {
            const c = MARKET_ZIP_COORDS[m.zip];
            const meteo = c ? meteoCache[`${c[0]},${c[1]}`] : null;
            const oh = getOpenHours(m, date);
            let weatherBit = '';
            if (meteo && oh) {
                const midHour = Math.round((oh.open + oh.close) / 2);
                const idx = indexAt(meteo.hourly, date, midHour);
                if (idx >= 0) {
                    const apparent = Math.round(meteo.hourly.apparent_temperature[idx]);
                    const code = meteo.hourly.weather_code[idx];
                    const uv = Math.round(meteo.hourly.uv_index[idx]);
                    const uvL = uvLabel(uv);
                    weatherBit = `<span>${weatherEmoji(code)}</span> <span>${apparent}°</span>${uvL ? ` <span class="text-xs" style="color:${uvL.color}">UV ${uv}</span>` : ''}`;
                }
            }
            return `<li class="flex items-baseline gap-2 py-0.5">
                <div class="flex-1 min-w-0">
                    <span class="text-sm font-medium">${m.name}</span>${m.dogFriendly ? ' <span class="text-xs">🐕</span>' : ''}
                    <span class="text-xs text-slate-400 ml-1">${m.hours}</span>
                </div>
                <div class="text-sm flex items-baseline gap-1 flex-shrink-0">${weatherBit}</div>
            </li>`;
        };
        const satMktList = satMkts.map(m => mktItem(m, sat)).join('');
        const sunMktList = sunMkts.map(m => mktItem(m, sun)).join('');

        // Best sunset night: Sat vs Sun, only on Saturday (today vs tomorrow)
        let sunsetBlock = '';
        if (isSat) {
            try {
                const [satEval, sunEval] = await Promise.all([
                    evaluateSunset(sat),
                    evaluateSunset(sun),
                ]);
                const satRank = satEval.top ? GRADE_RANK[satEval.top.grade] : 99;
                const sunRank = sunEval.top ? GRADE_RANK[sunEval.top.grade] : 99;
                const winner = satRank <= sunRank
                    ? { night: 'Saturday', sunset: satEval.sunset, top: satEval.top }
                    : { night: 'Sunday',   sunset: sunEval.sunset, top: sunEval.top };
                if (winner.top) {
                    const gradeKey = winner.top.grade.replace('+', '\\+');
                    sunsetBlock = `<div class="rounded-lg p-3 bg-slate-700/30 mb-3">
                        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Best sunset night</div>
                        <div class="flex items-baseline justify-between">
                            <div>
                                <div class="font-semibold">${winner.night} · ${winner.top.name}</div>
                                <div class="text-xs text-slate-400 mt-0.5">${winner.top.label} · ${winner.top.cloud}% clouds · ${fmtTime(winner.sunset)}</div>
                            </div>
                            <div class="text-3xl font-bold leading-none grade-${gradeKey}">${winner.top.grade}</div>
                        </div>
                    </div>`;
                }
            } catch (e) {
                sunsetBlock = `<div class="text-slate-400 text-sm mb-3">Sunset forecast unavailable: ${e.message}</div>`;
            }
        }

        // Best stargazing: Sat vs Sun, top site of each
        let starBlock = '';
        try {
            const [satRanked, sunRanked] = await Promise.all([
                evaluateStargazeNight(sat),
                evaluateStargazeNight(sun),
            ]);
            const winner = satRanked[0].score >= sunRanked[0].score
                ? { night: 'Saturday', date: sat, top: satRanked[0] }
                : { night: 'Sunday', date: sun, top: sunRanked[0] };
            const cap = maxStargazeScore(winner.top.lat, winner.top.lon, winner.date.getTime());
            const pct = cap > 0 ? winner.top.score / cap : 0;
            const illum = moonIllumination(winner.date);
            starBlock = `<div class="rounded-lg p-3 bg-slate-700/30">
                <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Best stargazing night</div>
                <div class="flex items-baseline justify-between">
                    <div>
                        <div class="font-semibold">${winner.night} · ${winner.top.name}</div>
                        <div class="text-xs text-slate-400 mt-0.5">${winner.top.clearDarkH.toFixed(1)}h clear · ${winner.top.avgCloud != null ? Math.round(winner.top.avgCloud) + '% cloud' : 'no forecast'} · 🌙 ${Math.round(illum*100)}%</div>
                    </div>
                    <div class="text-xl font-bold" style="color: hsl(${50 - pct*5}, ${5 + pct*95}%, ${30 + pct*45}%)">${Math.round(pct * 100)}%</div>
                </div>
            </div>`;
        } catch (e) {
            starBlock = `<div class="text-slate-400 text-sm">Stargazing forecast unavailable: ${e.message}</div>`;
        }

        return `<section class="card rounded-xl p-4">
            <h2 class="text-lg font-semibold mb-3">Weekend prep</h2>

            <div class="mb-4">
                <div class="flex items-baseline justify-between mb-2">
                    <div class="label">Dog beaches</div>
                    <a class="section-link" href="https://samiprehn.github.io/sd_dog_beaches/" target="_blank" rel="noopener">full site ↗</a>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="text-xs text-slate-400 border-b border-white/10">
                                <th class="px-2 py-1 text-left font-normal">Day</th>
                                <th class="px-2 py-1 text-left font-normal">Beach</th>
                                <th class="px-2 py-1 text-left font-normal">High temp</th>
                                <th class="px-2 py-1 text-left font-normal">Wind</th>
                                <th class="px-2 py-1 text-left font-normal">Humidity</th>
                            </tr>
                        </thead>
                        <tbody>${beachRows}</tbody>
                    </table>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                <div>
                    <div class="label mb-1">Saturday markets</div>
                    <ul class="space-y-1">${satMktList || '<li class="text-xs text-slate-500">none</li>'}</ul>
                </div>
                <div>
                    <div class="label mb-1">Sunday markets</div>
                    <ul class="space-y-1">${sunMktList || '<li class="text-xs text-slate-500">none</li>'}</ul>
                </div>
            </div>

            ${sunsetBlock}
            ${starBlock}
        </section>`;
    }

    document.getElementById('editLocationsBtn').addEventListener('click', () => {
        renderSetup('', LOCATIONS);
    });

    run().catch(err => {
        document.getElementById('content').innerHTML = `<div class="card rounded-xl p-4"><p class="text-red-400">Couldn't load dashboard: ${err.message}</p></div>`;
    });
    </script>
</body>
</html>
